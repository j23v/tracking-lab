<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hub — Tracking Lab</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141619; --p1:#1b1e23; --p2:#22262c; --p3:#2a2f36; --borda:#2f343c; --borda2:#3a404a;
  --tx:#e6e9ee; --tx2:#a7afbb; --tx3:#7b8492;
  --verde:#35e35a; --verde2:#1f9e3d; --verde-f:#12301b; --laranja:#ff7a3d; --azul:#4d8dff; --ciano:#22b8c7;
  --verm:#ff5a5a; --verm-f:#3a1719; --amar:#f5c542; --amar-f:#3a3015;
  --r:3px; --fonte:'Chakra Petch',ui-sans-serif,system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 var(--fonte)}
body{min-height:100vh}
a{color:var(--verde)}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--verde2);color:#fff}
/* topo */
.topo{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:10px 20px;background:rgba(20,22,25,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--borda)}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tx)}
.marca img{height:36px;width:auto;display:block}
.nome{font-weight:700;letter-spacing:.12em;font-size:15px;text-transform:uppercase}
.nome b{color:var(--verde);font-weight:700}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--fonte);letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;border:1px solid var(--borda2);border-radius:var(--r);color:var(--tx2);background:var(--p1);white-space:nowrap}
.chip.verde{color:var(--verde);border-color:var(--verde2);background:var(--verde-f)}
.chip.amar{color:var(--amar);border-color:#7a6420;background:var(--amar-f)}
.chip.verm{color:var(--verm);border-color:#7a2a2d;background:var(--verm-f)}
.led{width:8px;height:8px;border-radius:1px;background:var(--tx3);flex:none;display:inline-block}
.led.ok{background:var(--verde);box-shadow:0 0 8px var(--verde)}
.led.meio{background:var(--amar);box-shadow:0 0 6px var(--amar)}
.led.bad{background:var(--verm);box-shadow:0 0 8px var(--verm)}
.led.opc{background:transparent;border:1px solid var(--tx3)}
/* layout */
.casca{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 57px)}
.trilho{border-right:1px solid var(--borda);background:var(--p1);padding:16px 12px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
.prog{margin:2px 8px 14px}
.prog .barra{height:6px;background:var(--p3);border-radius:1px;overflow:hidden;margin-top:7px}
.prog .barra i{display:block;height:100%;background:linear-gradient(90deg,var(--verde2),var(--verde));transition:width .4s}
.rot{font:600 11px/1 var(--fonte);letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)}
.passos{list-style:none;margin:0;padding:0}
.passos a{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:1px 0;border-radius:var(--r);color:var(--tx2);text-decoration:none;font-size:14px;border:1px solid transparent}
.passos a:hover{background:var(--p2);color:var(--tx)}
.passos a.on{background:var(--p2);border-color:var(--borda2);color:var(--tx)}
.passos .n{font:600 11px/1 var(--mono);color:var(--tx3);width:18px}
.passos .t{flex:1}
main{padding:28px 32px 60px;min-width:0;max-width:980px}
h1{font-size:26px;line-height:1.2;margin:0 0 6px;font-weight:700;letter-spacing:.02em}
h2{font-size:17px;margin:26px 0 10px;font-weight:600;letter-spacing:.03em}
.sub{color:var(--tx2);margin:0 0 20px;max-width:70ch}
p{margin:0 0 10px}
.mu{color:var(--tx2)}.mu3{color:var(--tx3)}.sm{font-size:13px}
.card{background:var(--p1);border:1px solid var(--borda);border-radius:var(--r);padding:18px 20px;margin:12px 0}
.card.destaque{border-color:var(--verde2);background:linear-gradient(180deg,var(--verde-f),var(--p1) 70%)}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.num{font:700 30px/1.1 var(--mono);letter-spacing:-.02em}
.lin{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid var(--borda)}
.lin:first-child{border-top:0}
.lin .led{margin-top:7px}
.lin .c{flex:1;min-width:0}
.lin b{display:block;font-weight:600}
.lin .d{color:var(--tx2);font-size:13.5px}
.passo-n{counter-reset:p;list-style:none;padding:0;margin:10px 0}
.passo-n li{counter-increment:p;position:relative;padding:3px 0 11px 38px}
.passo-n li::before{content:counter(p,decimal-leading-zero);position:absolute;left:0;top:2px;font:600 12px/1 var(--mono);color:var(--verde);border:1px solid var(--verde2);border-radius:2px;padding:4px 5px}
/* controles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:var(--r);border:1px solid var(--borda2);background:var(--p2);color:var(--tx);cursor:pointer;font-weight:600;letter-spacing:.04em;font-size:14px;text-decoration:none;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--tx3)}
.btn.pri{background:var(--verde);border-color:var(--verde);color:#0b1a0f}
.btn.pri:hover{background:#4ff06f}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.fant{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn .gira{width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:g .7s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.campo{display:grid;gap:6px;margin:10px 0}
label.r{font:600 11px/1 var(--fonte);letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
input[type=text],input[type=password],input[type=url],input[type=email],textarea,select{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--borda2);border-radius:var(--r);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--verde2);box-shadow:0 0 0 3px rgba(53,227,90,.12)}
textarea{font:13px/1.5 var(--mono);min-height:120px;resize:vertical}
.linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linha > input{flex:1;min-width:200px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tog{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--borda2);border-radius:var(--r);background:var(--p2);cursor:pointer;font-size:14px;user-select:none}
.tog input{display:none}
.tog .cx{width:12px;height:12px;border:1px solid var(--tx3);border-radius:1px;display:inline-block}
.tog.on{border-color:var(--verde2);background:var(--verde-f)}
.tog.on .cx{background:var(--verde);border-color:var(--verde);box-shadow:0 0 6px var(--verde)}
.tog.des{opacity:.45;cursor:default}
.tog small{color:var(--tx3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.det{color:var(--verde);font:600 10px/1 var(--fonte);letter-spacing:.1em;text-transform:uppercase}
.codigo{position:relative;background:#0d0f12;border:1px solid var(--borda);border-radius:var(--r);padding:12px 92px 12px 14px;font:12.5px/1.6 var(--mono);color:#cfe9d6;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:8px 0}
.codigo .cp{position:absolute;top:8px;right:8px}
.aviso{border:1px solid var(--borda2);border-left:3px solid var(--amar);background:var(--p1);padding:11px 14px;border-radius:var(--r);margin:12px 0;font-size:14px}
.aviso.bad{border-left-color:var(--verm)}.aviso.ok{border-left-color:var(--verde)}.aviso.info{border-left-color:var(--azul)}
.abas{display:flex;gap:4px;border-bottom:1px solid var(--borda);margin:14px 0 4px;flex-wrap:wrap}
.abas button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--tx2);cursor:pointer;font-weight:600;letter-spacing:.03em}
.abas button.on{color:var(--verde);border-bottom-color:var(--verde)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--borda)}
th{font:600 11px/1 var(--fonte);letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
td.n{text-align:right;font-family:var(--mono)}
.barra2{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.barra2 .tr{height:8px;background:var(--p3);border-radius:1px;overflow:hidden}
.barra2 .tr i{display:block;height:100%;background:var(--verde)}
.barra2 .v{text-align:right;font-family:var(--mono);color:var(--tx2)}
.tag{display:inline-block;font:500 11px/1 var(--mono);padding:3px 6px;border:1px solid var(--borda2);border-radius:2px;color:var(--tx2);margin:2px 3px 2px 0}
.oculto{display:none!important}
#toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:50}
.toast{background:var(--p2);border:1px solid var(--borda2);border-left:3px solid var(--verde);padding:10px 14px;border-radius:var(--r);min-width:240px;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.4);font-size:14px;animation:sobe .25s}
.toast.bad{border-left-color:var(--verm)}
@keyframes sobe{from{transform:translateY(8px);opacity:0}}
.vazio{padding:28px;text-align:center;color:var(--tx3);border:1px dashed var(--borda2);border-radius:var(--r)}
.fundo-ia{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
.painel-ia{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--p1);border-left:1px solid var(--borda2);z-index:21;padding:20px 22px 40px;overflow:auto;animation:entra .2s}
@keyframes entra{from{transform:translateX(24px);opacity:0}}
.chat{display:grid;gap:8px;margin:12px 0;max-height:calc(100vh - 330px);min-height:180px;overflow:auto;align-content:start}
.msg{padding:9px 12px;border-radius:var(--r);border:1px solid var(--borda);background:var(--p2);font-size:14px;overflow-wrap:anywhere;max-width:92%}
.msg.eu{justify-self:end;background:var(--verde-f);border-color:var(--verde2)}
.msg.erro{border-left:3px solid var(--amar)}
.msg code{font:12.5px var(--mono);color:#cfe9d6}
.menu-mob{display:none}
@media (max-width:860px){
  .casca{grid-template-columns:1fr}
  .trilho{position:static;height:auto;border-right:0;border-bottom:1px solid var(--borda);display:none}
  .trilho.aberto{display:block}
  .menu-mob{display:inline-flex}
  main{padding:20px 16px 50px}
  .topo{padding:10px 16px}
  .nome,.topo .ver,#modo{display:none}
  .topo{gap:8px}
  .barra2{grid-template-columns:96px 1fr 44px}
}
</style>
</head>
<body>
<header class="topo">
  <button class="btn sm fant menu-mob" id="menu" aria-label="Etapas">☰</button>
  <a class="marca" href="#/painel">{{LOGO}}<span class="nome">Tracking <b>Lab</b></span></a>
  <span class="sp"></span>
  <button class="btn sm pri" id="abrirIA" type="button">Assistente</button>
  <span class="chip" id="modo">—</span>
  <span class="chip mu3 ver" title="Versão instalada">v{{VERSAO}}</span>
  <form method="post" action="/lab/sair" style="margin:0"><button class="btn sm fant" type="submit">Sair</button></form>
</header>
<div class="casca">
  <nav class="trilho" id="trilho" aria-label="Etapas">
    <div class="prog"><div class="linha" style="justify-content:space-between"><span class="rot">Progresso</span><span class="rot" id="progtxt">0/10</span></div><div class="barra"><i id="progbar" style="width:0"></i></div></div>
    <ul class="passos" id="passos"></ul>
  </nav>
  <main id="tela"><div class="vazio">Carregando…</div></main>
</div>
<div id="fundoIA" class="fundo-ia oculto"></div>
<aside id="painelIA" class="painel-ia oculto" aria-label="Assistente de IA"></aside>
<div id="toasts" aria-live="polite"></div>

<script>
(() => {
const ORIGEM = '{{ORIGEM}}';
let S = null;        // o estado (GET /lab/api/status)
let P = null;        // os perfis (GET /lab/api/perfis)
const cache = {};    // respostas que valem a sessao (qualidade, versao...)

// ------------------------------------------------------------------ apoio
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const quando = (ms) => ms ? new Date(ms).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
function toast(msg, tipo = 'ok') {
  const t = document.createElement('div'); t.className = `toast ${tipo === 'bad' ? 'bad' : ''}`; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 4200);
}
async function api(caminho, corpo) {
  const r = await fetch(`/lab/api/${caminho}`, corpo === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
  if (r.status === 401) { location.reload(); throw new Error('sessão expirou'); }
  const j = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, j };
}
async function carregar() {
  const [a, b] = await Promise.all([api('status'), api('perfis')]);
  S = a.j; P = b.j;
  ETAPAS = (S.etapas || []).map((e) => ({ id: e.id, t: e.titulo, opc: e.opcional, st: () => e.luz }));
}
/** Botao com "girando" enquanto a acao roda; recarrega o estado e redesenha. */
function acao(sel, fn, { recarregar = true } = {}) {
  const b = typeof sel === 'string' ? $(sel) : sel;
  if (!b) return;
  b.addEventListener('click', async (e) => {
    e.preventDefault();
    if (b.disabled) return;
    const antes = b.innerHTML; b.disabled = true; b.innerHTML = `<span class="gira"></span>${antes}`;
    try { await fn(); if (recarregar) { await carregar(); desenhar(); } }
    catch (err) { toast(err.message || 'Algo deu errado', 'bad'); }
    finally { if (document.body.contains(b)) { b.disabled = false; b.innerHTML = antes; } }
  });
}
function copiaveis(raiz = document) {
  raiz.querySelectorAll('.codigo').forEach((c) => {
    if (c.querySelector('.cp')) return;
    const b = document.createElement('button'); b.className = 'btn sm cp'; b.type = 'button'; b.textContent = 'Copiar';
    b.onclick = async () => { try { await navigator.clipboard.writeText(c.dataset.txt ?? c.textContent.replace(/Copiar$/, '')); b.textContent = 'Copiado ✓'; setTimeout(() => (b.textContent = 'Copiar'), 1500); } catch { toast('Não consegui copiar. Selecione o texto.', 'bad'); } };
    c.appendChild(b);
  });
}
const codigo = (txt) => `<div class="codigo" data-txt="${esc(txt)}">${esc(txt)}</div>`;
const lin = (led, titulo, detalhe = '', extra = '') => `<div class="lin"><span class="led ${led}"></span><div class="c"><b>${titulo}</b>${detalhe ? `<span class="d">${detalhe}</span>` : ''}</div>${extra}</div>`;
const tog = (nome, valor, rotulo, on, { des = false, nota = '', det = false } = {}) =>
  `<label class="tog ${on ? 'on' : ''} ${des ? 'des' : ''}"><input type="checkbox" name="${nome}" value="${esc(valor)}" ${on ? 'checked' : ''} ${des ? 'disabled' : ''}><span class="cx"></span>${esc(rotulo)}${det ? ' <span class="det">detectado</span>' : ''}${nota ? ` <small>${esc(nota)}</small>` : ''}</label>`;
function ligarToggles(raiz) {
  raiz.querySelectorAll('.tog input').forEach((i) => i.addEventListener('change', () => i.closest('.tog').classList.toggle('on', i.checked)));
}
const seg = (nome) => (S.segredos || []).find((s) => s.nome === nome);
const cfg = () => S.config || {};
const conf = (k) => Boolean(cfg().confirmacoes?.[k]);
const nomeCk = (id) => (P?.prontos || []).find((p) => p.id === id)?.nome || (id === 'outro' ? 'Outro checkout' : id);
const usados = () => cfg().checkouts || [];

// ------------------------------------------------------------------ etapas
// As etapas e a luz de cada uma vem do sistema (src/receitas.js): a mesma regra da IA.
let ETAPAS = [];
const ferramentasRisco = () => (S.deteccao?.ferramentas || []).filter((f) => f.id === 'utmify' || f.id === 'metawp');

function desenharTrilho(atual) {
  const obrig = ETAPAS.filter((e) => !e.opc);
  const feitas = obrig.filter((e) => e.st() === 'ok').length;
  $('#progtxt').textContent = `${feitas}/${obrig.length}`;
  $('#progbar').style.width = `${Math.round((feitas / obrig.length) * 100)}%`;
  $('#passos').innerHTML = `<li><a href="#/painel" class="${atual === 'painel' ? 'on' : ''}"><span class="n">00</span><span class="t">Painel</span></a></li>`
    + ETAPAS.map((e, i) => `<li><a href="#/${e.id}" class="${atual === e.id ? 'on' : ''}"><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${e.t}</span><span class="led ${e.st()}"></span></a></li>`).join('');
  const m = $('#modo');
  if (cfg().codigo_teste) { m.className = 'chip amar'; m.innerHTML = '<span class="led meio"></span>Modo teste'; }
  else if (S.ultimoTeste?.ok) { m.className = 'chip verde'; m.innerHTML = '<span class="led ok"></span>Valendo'; }
  else { m.className = 'chip'; m.innerHTML = '<span class="led"></span>Configurando'; }
}
const proxima = () => ETAPAS.find((e) => !e.opc && e.st() !== 'ok');
const rodape = (id) => {
  const i = ETAPAS.findIndex((e) => e.id === id);
  const prox = ETAPAS[i + 1];
  return `<div class="linha" style="margin-top:26px;justify-content:space-between">${i > 0 ? `<a class="btn fant" href="#/${ETAPAS[i - 1].id}">← ${ETAPAS[i - 1].t}</a>` : '<span></span>'}${prox ? `<a class="btn" href="#/${prox.id}">${prox.t} →</a>` : ''}</div>`;
};

// ------------------------------------------------------------------ telas
const TELAS = {};

TELAS.painel = () => {
  const p = proxima();
  const tot = (ev, st) => (S.envios24h || []).filter((e) => e.evento === ev && (!st || e.status === st) && !e.teste).reduce((s, e) => s + e.n, 0);
  return `<h1>Painel</h1><p class="sub">Tudo do seu rastreamento num lugar. Siga as etapas: cada luz verde é um passo certo.</p>
  ${p ? `<div class="card destaque"><span class="rot">Próximo passo</span><h2 style="margin:6px 0 8px">${p.t}</h2><a class="btn pri" href="#/${p.id}">Continuar →</a></div>`
      : '<div class="card destaque"><span class="rot">Tudo pronto</span><h2 style="margin:6px 0 8px">Seu rastreamento está valendo</h2><a class="btn" href="#/resultados">Ver resultados →</a></div>'}
  ${(S.alertas || []).map((a) => `<div class="aviso bad"><b>${esc(textoAlerta(a.tipo))}</b> <span class="mu sm">· ${quando(a.quando)}</span></div>`).join('')}
  <div class="grade">
    <div class="card"><span class="rot">Compras aceitas · 24 h</span><div class="num">${tot('Purchase', 'enviado')}</div><span class="mu sm">com problema: ${tot('Purchase') - tot('Purchase', 'enviado')}</span></div>
    <div class="card"><span class="rot">Visitas · 24 h</span><div class="num">${S.visitas24h?.n || 0}</div><span class="mu sm">com clique de anúncio: ${S.visitas24h?.fbc || 0}</span></div>
    <div class="card"><span class="rot">Último aviso de venda</span><div class="num" style="font-size:20px;margin-top:6px">${S.ultimoWebhook ? quando(S.ultimoWebhook.quando) : '—'}</div><span class="mu sm">${S.ultimoWebhook ? esc(nomeCk(S.ultimoWebhook.checkout)) + ' · ' + esc(S.ultimoWebhook.tipo || '') : 'nenhum ainda'}</span></div>
  </div>
  <h2>Etapas</h2><div class="card">${ETAPAS.map((e, i) => lin(e.st(), `<a href="#/${e.id}" style="color:inherit;text-decoration:none">${String(i + 1).padStart(2, '0')} · ${e.t}</a>`, e.opc ? 'opcional' : '')).join('')}</div>`;
};

function textoAlerta(t) {
  return ({ chave_invalida: 'A chave do Meta parou de funcionar — gere outra na etapa Chave do Meta', webhook_sem_token: 'Chegou um aviso de venda, mas falta o token do checkout', webhook_token_errado: 'Chegou um aviso de venda com o token errado' })[t] || t;
}

TELAS.plataformas = () => {
  const d = S.deteccao;
  const pixelsAchados = d?.pixels || [];
  const pixels = [...new Set([...(cfg().pixels || []), ...pixelsAchados])];
  const detCk = new Set((d?.checkouts || []).map((c) => c.id));
  const prontos = (P?.prontos || []);

<ul><li><strong>Entregar o que você comprou e atender você</strong> — base legal: execução de contrato.</li>
<li><strong>Cumprir a lei e evitar fraudes</strong> — base legal: obrigação legal e legítimo interesse.</li>

<h2>7. Seus direitos</h2>

// ------------------------------------------------------------------ o assistente
// O painel com a IA da casa (src/ia.js), o conector da IA do cliente (a IA ganha os
// "botoes" do Tracking Lab, src/mcp.js) e o texto pronto para colar em qualquer IA.
let conectorUrl = '';   // o endereco so existe na tela logo depois de criado
let abaIA = 'casa';
let iaEscolhida = 'claude';
const conversa = [];    // a conversa com a IA da casa: so nesta tela, nada fica guardado
let esperandoIA = false;

const CHAVE_NO_TEXTO = /\bEAA[A-Za-z0-9_-]{20,}/g;
/** Negrito e codigo do modelo, depois de escapar: nenhum HTML dele entra na tela. */
const textoDaIA = (t) => esc(t).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>');

function desenharConversa() {
  const lista = $('#chatLista');
  if (!lista) return;
  lista.innerHTML = (conversa.length ? '' : '<div class="msg">Oi! Pergunte sobre a sua etapa. Eu explico o passo a passo, e quem faz e confere é você, aqui no Hub. Se quiser, cole aqui a chave do Meta, que o sistema confere e guarda.</div>')
    + conversa.map((m) => `<div class="msg ${m.role === 'user' ? 'eu' : ''} ${m.erro ? 'erro' : ''}">${textoDaIA(m.content)}</div>`).join('')
    + (esperandoIA ? '<div class="msg mu"><span class="gira" style="display:inline-block;width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:g .7s linear infinite"></span> Pensando…</div>' : '');
  lista.scrollTop = lista.scrollHeight;
}
async function enviarAoChat() {
  const campo = $('#chatTexto');
  const texto = campo.value.trim();
  if (!texto || esperandoIA) return;
  campo.value = '';
  // A chave vai uma vez ao sistema e nao fica na tela nem no historico.
  const mensagens = [...conversa.filter((m) => !m.erro).map(({ role, content }) => ({ role, content })), { role: 'user', content: texto }];
  conversa.push({ role: 'user', content: texto.replace(CHAVE_NO_TEXTO, 'EAA… (chave)') });
  esperandoIA = true; desenharConversa();
  try {
    const r = await api('chat', { mensagens, etapa: rotaAtual() });
    conversa.push({ role: 'assistant', content: r.j.texto || 'Não consegui responder agora.', erro: Boolean(r.j.erro) });
    if (r.j.recarregar) { await carregar(); desenharTrilho(rotaAtual()); }
  } catch {
    conversa.push({ role: 'assistant', content: 'Não consegui responder agora. Confira sua internet e tente de novo.', erro: true });
  }
  esperandoIA = false; desenharConversa();
  $('#chatTexto')?.focus();
}

    '',
    'As etapas do meu Hub:',
    ...ETAPAS.map((e, i) => `${i + 1}. ${e.t}: ${luz[e.st()] ?? e.st()}`),
    '',
    p ? `Estou na etapa "${p.t}". Me ajude com ela.` : 'Todas as etapas estão ok. Me ajude a entender os resultados.',
    '',
    'Regras:',
    '- Quem diz se um passo ficou certo é o Hub: depois de cada passo, me peça para apertar "Conferir".',
    '- Se eu colar a chave do Meta (começa com EAA), confirme se é ela e me diga para colar no Hub, na etapa Chave do Meta.',
    '- Em cada pixel, só o Tracking Lab manda a Compra: ela fica desligada no checkout e em outras ferramentas.',
    '- Não sugira gerar a chave por outra BM para fugir de um bloqueio do Meta.',
    '- Se não tiver certeza de onde fica um menu, me peça um print em vez de adivinhar.',
  ].join('\n');
}

async function desenharIA() {
  const alvo = $('#painelIA');
  if (!cache.chat) {
    alvo.innerHTML = '<div class="vazio">Carregando…</div>';
    cache.chat = (await api('chat')).j;
  }
  // Instalacao sem a IA da casa (copia antiga): a opcao nem aparece.
  if (!cache.chat.disponivel && abaIA === 'casa') abaIA = 'conectar';
  const abas = `<div class="abas">${[...(cache.chat.disponivel ? [['casa', 'IA do Tracking Lab']] : []), ['conectar', 'Conectar a minha IA'], ['colar', 'Só copiar e colar']].map(([id, t]) => `<button type="button" data-aba="${id}" class="${abaIA === id ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  let corpo;
  if (abaIA === 'casa') {
    corpo = `<p class="mu sm" style="margin-top:12px">Grátis, na sua conta Cloudflare. Ela explica, mas pode errar: quem diz se ficou certo é o Hub. Se a sua conta Cloudflare for paga, o que passar da cota grátis é cobrado.</p>
    <div class="chat" id="chatLista" aria-live="polite"></div>
    <form id="chatForm" class="linha"><input type="text" id="chatTexto" placeholder="Escreva sua pergunta" aria-label="Sua pergunta" autocomplete="off" maxlength="1500"><button class="btn pri" type="submit">Enviar</button></form>`;
  } else if (abaIA === 'colar') {
    corpo = `<p class="mu" style="margin-top:12px">Funciona em qualquer IA, sem instalar nada: ela explica e você clica. O texto já diz em que etapa você está e quais plataformas usa.</p>${codigo(textoPronto())}<p class="mu sm">O texto muda conforme você avança: copie de novo numa conversa nova.</p>`;
  } else {
    if (!cache.conector) alvo.innerHTML = '<div class="vazio">Carregando…</div>';
    const c = cache.conector || (cache.conector = (await api('conector')).j);
    const u = conectorUrl;
    const ia = IAS[iaEscolhida];
    corpo = `<p class="mu" style="margin-top:12px">Com o conector, a sua IA vê as luzes, mostra o passo certo para as suas plataformas, salva a chave que você colar e confere cada etapa. Quem liga de verdade continua sendo você, aqui no Hub.</p>
    ${u ? '' : `<div class="card">${c.ativo ? lin('ok', 'Conector criado', `em ${quando(c.quando)}. O endereço completo só aparece na criação: se precisar dele de novo, crie outro (o anterior para de funcionar).`) : lin('', 'Ainda sem conector')}<div class="linha" style="margin-top:8px"><button class="btn ${c.ativo ? '' : 'pri'}" id="criarConector" type="button">${c.ativo ? 'Criar outro endereço' : 'Criar o endereço do conector'}</button></div></div>`}
    ${u ? `<div class="aviso ok"><b>Endereço criado.</b> Copie agora: ele é a chave de entrada da sua IA no Tracking Lab, então trate como uma senha.</div>
    <div class="abas" id="abasIA">${Object.entries(IAS).map(([id, x]) => `<button type="button" data-ia="${id}" class="${iaEscolhida === id ? 'on' : ''}">${x.nome}</button>`).join('')}</div>
    <ol class="passo-n">${ia.passos(u).map((p) => `<li>${p}</li>`).join('')}</ol>
    <p class="mu sm">Os menus de cada IA podem mudar de nome. Se não achar, pergunte a ela mesma como adicionar um conector MCP pela URL.</p>` : ''}`;
  }
  alvo.innerHTML = `<div class="linha" style="justify-content:space-between"><h1 style="margin:0">Assistente</h1><button class="btn sm fant" id="fecharIA" type="button">Fechar</button></div>${abas}${corpo}`;
  copiaveis(alvo);
  $('#fecharIA').onclick = () => alternarIA(false);
  if (abaIA === 'casa') {
    desenharConversa();
    $('#chatForm').onsubmit = (e) => { e.preventDefault(); enviarAoChat(); };
  }
  alvo.querySelectorAll('[data-aba]').forEach((b) => b.onclick = () => { abaIA = b.dataset.aba; desenharIA(); });
  alvo.querySelectorAll('[data-ia]').forEach((b) => b.onclick = () => { iaEscolhida = b.dataset.ia; desenharIA(); });
  acao('#criarConector', async () => {
    const r = await api('conector', {});
    if (!r.j.url) throw new Error('Não consegui criar o endereço');
    conectorUrl = r.j.url; cache.conector = { ativo: true, dica: r.j.dica, quando: r.j.quando };
    desenharIA();
  }, { recarregar: false });
}
function alternarIA(abrir) {
  $('#painelIA').classList.toggle('oculto', !abrir);
  $('#fundoIA').classList.toggle('oculto', !abrir);
  if (abrir) desenharIA().catch((e) => toast(e.message, 'bad'));
}
$('#abrirIA').onclick = () => alternarIA(true);
$('#fundoIA').onclick = () => alternarIA(false);

// ------------------------------------------------------------------ roteador
const rotaAtual = () => (location.hash.replace(/^#\/?/, '') || 'painel').split('?')[0];
function desenhar() {
  const id = TELAS[rotaAtual()] ? rotaAtual() : 'painel';
  desenharTrilho(id);
  const tela = $('#tela');
  tela.innerHTML = TELAS[id]();
  copiaveis(tela);
  if (TELAS[id].ligar) TELAS[id].ligar(tela);
  $('#trilho').classList.remove('aberto');
}
window.addEventListener('hashchange', () => { desenhar(); window.scrollTo(0, 0); });
$('#menu').onclick = () => $('#trilho').classList.toggle('aberto');
carregar().then(desenhar).catch((e) => { $('#tela').innerHTML = `<div class="aviso bad">Não consegui carregar o Hub: ${esc(e.message)}</div>`; });
})();
</script>
